# Verdity Enforcement Rules
# Place this file at .verdity/rules.yml in your repository
# Rules are evaluated in priority order (lower = higher priority)
# First matching rule determines the action

rules:
  # ─── Security Critical ──────────────────────────────────────────
  - id: "sql-injection-block"
    when: "finding.concern == 'security' and finding.severity == 'critical' and regex_search(finding.content, PATTERNS.sql_injection)"
    then: "BLOCK"
    message: "Critical SQL injection vulnerability detected in {{file}}:{{line_start}}"
    priority: 10
    enabled: true

  - id: "secret-exposure-block"
    when: "finding.concern == 'security' and finding.severity in ('critical', 'high') and regex_search(finding.content, PATTERNS.secret)"
    then: "BLOCK"
    message: "Secret/credential exposure detected in {{file}}:{{line_start}}"
    priority: 15
    enabled: true

  - id: "xss-critical-block"
    when: "finding.concern == 'security' and finding.severity == 'critical' and regex_search(finding.content, PATTERNS.xss)"
    then: "BLOCK"
    message: "Critical XSS vulnerability in {{file}}:{{line_start}}"
    priority: 20
    enabled: true

  - id: "path-traversal-block"
    when: "finding.concern == 'security' and finding.severity in ('critical', 'high') and regex_search(finding.content, PATTERNS.path_traversal)"
    then: "BLOCK"
    message: "Path traversal vulnerability in {{file}}:{{line_start}}"
    priority: 25
    enabled: true

  # ─── High Severity Security ──────────────────────────────────────
  - id: "security-high-require-approval"
    when: "finding.concern == 'security' and finding.severity == 'high' and finding.confidence > 0.7"
    then: "REQUIRE_APPROVAL"
    message: "High-severity security issue requires approval: {{finding.summary}}"
    priority: 50
    enabled: true

  # ─── Code Quality ────────────────────────────────────────────────
  - id: "complexity-escalate"
    when: "finding.concern == 'code_quality' and 'complexity' in finding.summary.lower() and finding.severity in ('high', 'critical')"
    then: "ESCALATE"
    message: "High complexity code needs refactoring: {{file}}:{{line_start}}"
    priority: 100
    enabled: true

  - id: "anti-pattern-require-approval"
    when: "finding.concern == 'code_quality' and any(p in finding.summary.lower() for p in ['god class', 'spaghetti', 'anti-pattern'])"
    then: "REQUIRE_APPROVAL"
    message: "Anti-pattern detected requires team review: {{finding.summary}}"
    priority: 110
    enabled: true

  # ─── Testing ─────────────────────────────────────────────────────
  - id: "no-tests-escalate"
    when: "finding.concern == 'testing' and finding.severity in ('high', 'critical')"
    then: "ESCALATE"
    message: "Missing critical tests: {{finding.summary}}"
    priority: 150
    enabled: true

  # ─── Documentation ───────────────────────────────────────────────
  - id: "public-api-docs-require-approval"
    when: "finding.concern == 'documentation' and finding.severity == 'high' and 'public' in finding.content.lower()"
    then: "REQUIRE_APPROVAL"
    message: "Public API missing documentation: {{file}}"
    priority: 200
    enabled: true

  # ─── Default: Allow everything else ──────────────────────────────
  # (No rule needed - default action is ALLOW)

# Rule variables available in templates:
# {{file}}, {{line_start}}, {{finding.line_end}}
# {{finding.severity}}, {{finding.confidence}}, {{finding.concern}}
# {{finding.summary}}, {{finding.explanation}}, {{finding.content}}
# {{finding.rule_id}} (if available)

# Built-in patterns:
# PATTERNS.secret - API keys, tokens, passwords
# PATTERNS.sql_injection - SQL injection patterns
# PATTERNS.xss - XSS patterns
# PATTERNS.path_traversal - Path traversal (../)

# Custom variables can be passed via --var key=value
# Example: verdity-review enforce --var team=backend --var env=prod
