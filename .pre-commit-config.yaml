repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-logger

  - repo: local
    hooks:
      - id: silent-failure-hunter
        name: Silent Failure Hunter
        entry: python -m silent_failure_hunter scan
        language: system
        types: [python]
        args: [--project, .]
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      - id: coverage-check
        name: Coverage Check
        entry: python -m pytest --cov=src/verdity --cov-fail-under=95 -q
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
