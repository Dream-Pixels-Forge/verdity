repos:
  # Same formatter and linter as CI (.github/workflows/ci.yml): ruff only, no black.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: silent-failure-hunter
        name: Silent Failure Hunter
        # Skips with a notice when silent-failure-hunter isn't installed.
        entry: scripts/pre-commit-silent-failure.sh
        language: script
        types: [python]
        pass_filenames: false
        require_serial: true

  - repo: local
    hooks:
      - id: coverage-check
        name: Coverage Check
        entry: python -m pytest -q  # coverage gate (100%) comes from pytest.ini
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
